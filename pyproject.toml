[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "options-pricing-engine"
version = "0.1.0"
description = "A from-scratch options pricing engine: Black-Scholes pricers, Greeks, numerical methods, volatility and market modules."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
notebook = [
    "matplotlib>=3.7",
    "pandas>=2.0",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
